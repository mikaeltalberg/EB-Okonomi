name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Secrets Exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "❌ ERROR: SUPABASE_URL secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "❌ ERROR: SUPABASE_ANON_KEY secret is missing!"
            exit 1
          fi
          if [ -z "${{ secrets.MSAL_CLIENT_ID }}" ]; then
            echo "❌ ERROR: MSAL_CLIENT_ID secret is missing!"
            exit 1
          fi
          echo "✅ All required secrets are present"

      - name: Generate config.js from Secrets
        run: |
          # Trim whitespace from secrets to prevent issues
          SUPABASE_URL=$(echo "${{ secrets.SUPABASE_URL }}" | xargs)
          SUPABASE_ANON_KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | xargs)
          STRIPE_PUBLISHABLE_KEY=$(echo "${{ secrets.STRIPE_PUBLISHABLE_KEY }}" | xargs)
          STRIPE_REDIRECT_URL=$(echo "${{ secrets.STRIPE_REDIRECT_URL }}" | xargs)
          MSAL_CLIENT_ID=$(echo "${{ secrets.MSAL_CLIENT_ID }}" | xargs)
          MSAL_AUTHORITY=$(echo "${{ secrets.MSAL_AUTHORITY }}" | xargs)
          
          cat > config.js << EOF
          // ===========================
          // SUPABASE CONFIGURATION
          // ===========================
          // 
          // This file is auto-generated during deployment
          // Secrets are stored in GitHub Secrets and injected here
          
          const SUPABASE_CONFIG = {
              url: "${SUPABASE_URL}",
              anonKey: "${SUPABASE_ANON_KEY}"
          };
          
          // ===========================
          // STRIPE CONFIGURATION
          // ===========================
          
          const STRIPE_CONFIG = {
              publishableKey: "${STRIPE_PUBLISHABLE_KEY}"
          };
          
          const STRIPE_REDIRECT_URL = "${STRIPE_REDIRECT_URL}";
          
          // ===========================
          // MICROSOFT OAUTH CONFIGURATION
          // ===========================
          
          const MSAL_CONFIG = {
              clientId: "${MSAL_CLIENT_ID}",
              authority: "${MSAL_AUTHORITY}",
              redirectUri: window.location.origin + window.location.pathname,
              scopes: [
                  "User.Read",
                  "Files.ReadWrite.All",
                  "offline_access"
              ]
          };
          
          // Office 365 API endpoints
          const OFFICE365_CONFIG = {
              graphEndpoint: "https://graph.microsoft.com/v1.0",
              dataFolderName: "EB-Okonomi-Data"
          };
          EOF
          echo "✅ config.js generated from GitHub Secrets"
          
      - name: Verify config.js was generated
        run: |
          if [ ! -f config.js ]; then
            echo "❌ ERROR: config.js was not created!"
            exit 1
          fi
          if grep -q "YOUR_SUPABASE" config.js; then
            echo "❌ ERROR: config.js still contains placeholders!"
            echo "Secrets may not be set correctly."
            exit 1
          fi
          echo "✅ config.js verified - contains real values"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

